# Lecta Sovereign AI Control Framework — meta
framework: Lecta Sovereign AI Control Framework
version: v1.0-draft
schema: ../schema.md

profiles:
  CE: {name: Controlled External, desc: "Governed use of external models and services"}
  SOV: {name: Sovereign, desc: "Processing kept inside governed boundaries"}

levels:
  L0: Infrastructure baseline
  L1: Privacy foundation
  L2: Access & audit
  L3: Behavioural controls
  L4: Compliance operationalisation
  L5: Sector & geo compliance
  L6: Certification & attestation readiness   # third parties certify; Lecta prepares

layers: {CON: Containment, HYG: Hygiene, IDE: Identity, BEH: Behaviour, TRA: Traceability, ATT: Attestation}
stages: {ING: Ingestion, STO: Storage, PRM: Prompt, INF: Inference, RES: Response, DWN: Downstream}
g_domains: {POL: Policy, INV: Inventory, ROL: Roles, RSK: Risk & impact, SUP: Suppliers, LIT: Literacy & training, INC: Incidents, OVS: Human oversight}
text_fields: bilingual {en, tr}   # Gökhan 14 Oct; notes: single language allowed
evidence_types: {DOC: Document, CFG: Configuration, LOG: Log sample, TST: Test result, INT: Interview statement, OBS: Live observation}

scoring_rule:   # schema.md 5.5 — items with `checks`; implemented in tools/kontrol.py
  0: exist check (c1) not met
  1: c1 met, at least one core check not met
  2: c1 and all core checks met
  3: 2 + all sustain checks met (no sustain checks -> 3 not available)
  NE: c1 answered "don't know"
  NA: c1 answered NA (reason required)
sampling: {all_if_at_most: 10, otherwise_min: 5, record_selection: true, status: calibrate-in-pilot}

