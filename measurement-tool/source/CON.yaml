# Lecta Sovereign AI Control Framework — Containment layer
# framework v1.0-draft · schema: ../schema.md · text fields bilingual {en, tr}
# Session 3 (14 Oct 2026): L0–L1 key items for the Quick Scan cut (draft). Other CON cells: pending.

items:

  - id: CON-ING-01
    block: matrix
    layer: CON
    stage: ING
    title:
      en: Approved data sources only
      tr: Yalnız onaylı veri kaynakları
    objective:
      en: >
        A register of approved data sources for the AI system is maintained, and every
        ingestion path accepts data only from sources in the register; other inputs are
        rejected before processing.
      tr: >
        AI sistemi için onaylı veri kaynakları kaydı tutulur ve her veri giriş yolu yalnız
        kayıttaki kaynaklardan veri kabul eder; diğer girdiler işlenmeden reddedilir.
    question:
      en: Which sources may feed data into this AI system, and what happens to data from any other source?
      tr: Bu AI sistemine hangi kaynaklar veri besleyebilir ve başka bir kaynaktan gelen veriye ne oluyor?
    level: {CE: L0, SOV: L0}
    applicability:
      en: Same as HYG-ING-01 (at least one organisation-operated ingestion path).
      tr: HYG-ING-01 ile aynı (kurumun işlettiği en az bir veri giriş yolu).
    evidence:
      - type: DOC
        en: Approved source register (source, owner, data categories, path, approval date)
        tr: Onaylı kaynak kaydı (kaynak, sahip, veri kategorileri, giriş yolu, onay tarihi)
      - type: CFG
        en: Configuration on each ingestion path restricting accepted sources (allow-list, connector scope, upload permissions)
        tr: Her giriş yolunda kabul edilen kaynakları sınırlayan yapılandırma (izin listesi, bağlayıcı kapsamı, yükleme yetkileri)
      - type: LOG
        en: Rejection events for unapproved sources, or a test record if none occurred in the last 90 days
        tr: Onaysız kaynak ret kayıtları; son 90 günde olmadıysa test kaydı
    checks:   # A2 — puan schema.md 5.5 kuralıyla hesaplanır
      - id: c1
        kind: exist
        type: binary
        text:
          en: A register of approved data sources exists for the system.
          tr: Sistem için onaylı veri kaynakları kaydı var.
        terms:
        - approved-source-register
        evidence: DOC
        qs: true
      - id: c2
        kind: core
        type: ratio
        threshold:
          min: 1.0
        text:
          en: Share of sources actually feeding the system that are in the register.
          tr: Sistemi fiilen besleyen kaynaklardan kayıtta bulunanların oranı.
        terms:
        - approved-source-register
        evidence: DOC
        qs: true
        sampling: true
      - id: c3
        kind: core
        type: ratio
        threshold:
          min: 1.0
        text:
          en: Share of ingestion paths configured to accept data only from registered sources.
          tr: Yalnız kayıtlı kaynaklardan veri kabul edecek biçimde yapılandırılmış giriş yollarının oranı.
        terms:
        - path-inventory
        - ingestion-path
        evidence: CFG
        qs: true
        sampling: true
      - id: c4
        kind: core
        type: date
        threshold:
          max_days: 90
        text:
          en: Date of the latest rejection log entry, or of a dated test, showing an unapproved source being
            rejected.
          tr: Onaysız bir kaynağın reddedildiğini gösteren son ret kaydının ya da tarihli testin tarihi.
        evidence: LOG
        qs: false
      - id: s1
        kind: sustain
        type: date
        threshold:
          max_months: review_interval
        text:
          en: The register was reconciled against the running configuration; the dated record is within review_interval.
          tr: Kayıt çalışan yapılandırmayla karşılaştırılmış; tarihli kaydı review_interval içinde.
        terms:
        - dated-record
        evidence: DOC
        qs: true
      - id: s2
        kind: sustain
        type: binary
        text:
          en: Adding a source to the register requires a recorded approval.
          tr: Kayda kaynak eklemek kayıtlı bir onay gerektiriyor.
        evidence: DOC
        qs: true
    review_interval: 6
    quick_scan: true
    qs_question:
      en: Is it defined which systems or sources may feed data into your AI systems, and is anything else blocked?
      tr: AI sistemlerinize hangi sistem ya da kaynakların veri besleyebileceği tanımlı mı, diğerleri engelleniyor mu?
    validation_tests:
      - id: VT-CON-ING-01-a
        precondition:
          en: A test source not in the register; synthetic content only.
          tr: Kayıtta olmayan bir test kaynağı; yalnız sentetik içerik.
        steps:
          en: Attempt to ingest from the test source through each path that supports external sources.
          tr: Dış kaynak destekleyen her yoldan test kaynağıyla veri almayı dene.
        expected:
          en: Rejected before processing; nothing stored or indexed; event logged.
          tr: İşlenmeden reddediliyor; hiçbir şey saklanmıyor ya da indekslenmiyor; olay kaydediliyor.
        supports_score: 2
    mappings:
      - {framework: ISO/IEC 27001:2022, ref: "A.8.20, A.5.14"}
      - {framework: ISO/IEC 42001, ref: "Annex A.7.3 (acquisition of data)"}
      - {framework: KVKK, ref: "md. 12(1)"}
      - {framework: NIS2, ref: "Art. 21(2)"}
    services: [AS-01, AS-02, AS-03]
    legacy: "Containment x Ingestion — Source boundary"
    status: approved
    since: v1.0-draft
    notes: >
      v0 "approved sources, formats and protocols" üç gereksinimi tek cümlede topluyordu;
      format/protokol doğrulaması BEH-ING'e (şema) gider. Kaynak kimlik doğrulaması IDE-ING-01.

  - id: CON-ING-02
    block: matrix
    layer: CON
    stage: ING
    title:
      en: Encryption in transit
      tr: Aktarımda şifreleme
    objective:
      en: >
        All data flows into, within and out of the AI system, including calls to external
        model providers, are encrypted in transit with current protocol versions; unencrypted
        endpoints are not reachable.
      tr: >
        Dış model sağlayıcılarına yapılan çağrılar dahil AI sistemine giren, içinde dolaşan ve
        çıkan tüm veri akışları güncel protokol sürümleriyle aktarımda şifrelenir;
        şifresiz uç noktalara erişilemez.
    question:
      en: Are all connections to, within and from the AI system encrypted, and how is that verified?
      tr: AI sistemine giden, içinde dolaşan ve ondan çıkan tüm bağlantılar şifreli mi, bu nasıl doğrulanıyor?
    level: {CE: L0, SOV: L0}
    applicability:
      en: Always applicable.
      tr: Her zaman uygulanır.
    evidence:
      - type: DOC
        en: List of data flows (from the data-flow diagram) with protocol per flow
        tr: Akış başına protokolü gösteren veri akışları listesi (veri akış şemasından)
      - type: CFG
        en: Protocol and minimum-version configuration on endpoints and service-to-service links
        tr: Uç noktalarda ve servisler arası bağlantılarda protokol ve asgari sürüm yapılandırması
      - type: TST
        en: Scan or test result showing no plaintext or deprecated-protocol endpoint, dated within 6 months
        tr: Son 6 ay içinde tarihli, şifresiz ya da eskimiş protokollü uç nokta olmadığını gösteren tarama/test sonucu
    checks:   # A2 — puan schema.md 5.5 kuralıyla hesaplanır
      - id: c1
        kind: exist
        type: binary
        text:
          en: Every externally exposed flow, including calls to external model providers, is encrypted in transit.
          tr: Dış model sağlayıcılarına yapılan çağrılar dahil dışa açık her akış aktarımda şifreli.
        evidence: CFG
        qs: true
      - id: c2
        kind: core
        type: binary
        text:
          en: A list of data flows showing the protocol of each flow exists.
          tr: Her akışın protokolünü gösteren veri akışları listesi var.
        evidence: DOC
        qs: true
      - id: c3
        kind: core
        type: ratio
        threshold:
          min: 1.0
        text:
          en: Share of flows in the list, internal service-to-service flows included, that are encrypted in
            transit.
          tr: Listedeki akışlardan, servisler arası iç akışlar dahil, aktarımda şifreli olanların oranı.
        evidence: CFG
        qs: true
        sampling: true
      - id: c4
        kind: core
        type: binary
        text:
          en: Outdated protocol versions are rejected on every endpoint.
          tr: Eskimiş protokol sürümleri her uç noktada reddediliyor.
        terms:
        - outdated-protocol
        evidence: CFG
        qs: true
      - id: c5
        kind: core
        type: date
        threshold:
          max_months: 6
        text:
          en: Date of the latest scan or test showing no unencrypted or outdated-protocol endpoint is within
            the last 6 months.
          tr: Şifresiz ya da eskimiş protokollü uç nokta olmadığını gösteren son tarama/testin tarihi son 6
            ay içinde.
        terms:
        - outdated-protocol
        evidence: TST
        qs: false
      - id: s1
        kind: sustain
        type: binary
        text:
          en: Certificate expiry and protocol configuration are monitored with alerts.
          tr: Sertifika süreleri ve protokol yapılandırması alarmla izleniyor.
        evidence: CFG
        qs: true
      - id: s2
        kind: sustain
        type: binary
        text:
          en: At least two dated tests exist and the gap between the two most recent is not longer than review_interval.
          tr: En az iki tarihli test var ve son ikisi arasındaki süre review_interval'dan uzun değil.
        evidence: TST
        qs: true
    review_interval: 6
    quick_scan: false
    mappings:
      - {framework: KVKK, ref: "md. 12(1)"}
      - {framework: GDPR, ref: "Art. 32(1)(a)"}
      - {framework: ISO/IEC 27001:2022, ref: "A.8.24"}
      - {framework: NIS2, ref: "Art. 21(2)(h)"}
    services: [AS-02, AS-03]
    legacy: "L0 level text — TLS throughout (no v0 cell)"
    status: approved
    since: v1.0-draft
    notes: >
      v0 seviye metninde L0 şartıydı ama hücresi yoktu (01-hucre-analizi bulgu 2). CON-ING
      altında açıldı çünkü sınır kontrolü; tüm aşamaları kapsar. QS'de yok: beyanla cevap
      neredeyse her zaman "evet", bilgi değeri düşük.

  - id: CON-STO-01
    block: matrix
    layer: CON
    stage: STO
    title:
      en: Segmentation of AI data stores
      tr: AI veri depolarının ayrıştırılması
    objective:
      en: >
        Data stores used by the AI system (document corpora, vector indexes, model files,
        logs) are network-segmented so that only the components that need them can reach
        them; default network policy denies all other access.
      tr: >
        AI sisteminin kullandığı veri depoları (belge korpusları, vektör indeksleri, model
        dosyaları, kayıtlar) ağ düzeyinde ayrıştırılmıştır; yalnız ihtiyaç duyan bileşenler
        erişebilir ve varsayılan ağ politikası diğer tüm erişimi reddeder.
    question:
      en: Which components can reach the AI system's data stores over the network, and is everything else denied by default?
      tr: AI sisteminin veri depolarına ağ üzerinden hangi bileşenler erişebiliyor, diğer her şey varsayılan olarak engelli mi?
    level: {CE: L0, SOV: L0}
    applicability:
      en: >
        Applicable to stores operated by the organisation. For stores operated by an external
        provider, mark NA and assess G-SUP-01 and G-SUP-02.
      tr: >
        Kurumun işlettiği depolara uygulanır. Dış sağlayıcının işlettiği depolar için NA
        işaretlenir; G-SUP-01 ve G-SUP-02 değerlendirilir.
    evidence:
      - type: DOC
        en: Store inventory with the components allowed to reach each store
        tr: Her depoya erişebilen bileşenleri gösteren depo envanteri
      - type: CFG
        en: Network policy or firewall rules showing default deny and the allowed flows
        tr: Varsayılan reddi ve izinli akışları gösteren ağ politikası ya da firewall kuralları
      - type: TST
        en: Connection test from a non-allowed component, dated
        tr: İzinsiz bir bileşenden yapılmış, tarihli bağlantı testi
    checks:   # A2 — puan schema.md 5.5 kuralıyla hesaplanır
      - id: c1
        kind: exist
        type: binary
        text:
          en: At least one AI data store is network-segmented.
          tr: En az bir AI veri deposu ağ düzeyinde ayrıştırılmış.
        terms:
        - network-segmented
        - ai-data-store
        evidence: CFG
        qs: true
      - id: c2
        kind: core
        type: binary
        text:
          en: A store inventory shows which components may reach each store.
          tr: Depo envanteri her depoya hangi bileşenlerin erişebileceğini gösteriyor.
        terms:
        - ai-data-store
        evidence: DOC
        qs: true
      - id: c3
        kind: core
        type: ratio
        threshold:
          min: 1.0
        text:
          en: Share of stores in the inventory that are segmented with default-deny access.
          tr: Envanterdeki depolardan varsayılan red ile ayrıştırılmış olanların oranı.
        terms:
        - network-segmented
        - default-deny-access
        evidence: CFG
        qs: true
        sampling: true
      - id: c4
        kind: core
        type: binary
        text:
          en: The allowed flows in the network rules match the inventory (no wider access).
          tr: Ağ kurallarındaki izinli akışlar envanterle örtüşüyor (daha geniş erişim yok).
        evidence: CFG
        qs: false
      - id: c5
        kind: core
        type: binary
        text:
          en: A dated test from a component not on the inventory shows the connection rejected.
          tr: Envanterde olmayan bir bileşenden yapılmış tarihli test bağlantının reddedildiğini gösteriyor.
        evidence: TST
        qs: false
      - id: s1
        kind: sustain
        type: date
        threshold:
          max_months: review_interval
        text:
          en: The rules were reconciled against the inventory; the dated record is within review_interval.
          tr: Kurallar envanterle karşılaştırılmış; tarihli kaydı review_interval içinde.
        terms:
        - dated-record
        evidence: DOC
        qs: true
      - id: s2
        kind: sustain
        type: binary
        text:
          en: A change to these rules requires a recorded approval.
          tr: Bu kurallarda değişiklik kayıtlı bir onay gerektiriyor.
        evidence: DOC
        qs: true
    review_interval: 6
    quick_scan: false
    mappings:
      - {framework: ISO/IEC 27001:2022, ref: "A.8.22"}
      - {framework: KVKK, ref: "md. 12(1)"}
      - {framework: NIS2, ref: "Art. 21(2)"}
    services: [AS-02, AS-03]
    legacy: "Containment x Storage — Store isolation"
    status: approved
    since: v1.0-draft
    notes: >
      Belge düzeyinde yetki (A kullanıcısı B'nin belgesi) burada değil, IDE-STO / IDE-INF'te.
      Bu madde ağ düzeyi.

  - id: CON-STO-02
    block: matrix
    layer: CON
    stage: STO
    title:
      en: Encryption at rest with controlled keys
      tr: Kontrollü anahtarlarla depolamada şifreleme
    objective:
      en: >
        Every store holding AI data (corpora, indexes, model files, prompt and response logs,
        backups) is encrypted at rest, and the organisation knows who controls the keys.
      tr: >
        AI verisi tutan her depo (korpuslar, indeksler, model dosyaları, prompt ve yanıt
        kayıtları, yedekler) depolamada şifrelidir ve anahtarları kimin kontrol ettiği bilinir.
    question:
      en: Is every store holding AI data encrypted at rest, including logs and backups, and who holds the keys?
      tr: Kayıtlar ve yedekler dahil AI verisi tutan her depo depolamada şifreli mi, anahtarlar kimde?
    level: {CE: L1, SOV: L1}
    applicability:
      en: Always applicable. For provider-operated stores, evidence is the provider's documented encryption and key arrangement.
      tr: Her zaman uygulanır. Sağlayıcının işlettiği depolarda kanıt, sağlayıcının belgelenmiş şifreleme ve anahtar düzenidir.
    evidence:
      - type: DOC
        en: Store inventory (as CON-STO-01, plus provider-operated stores and backups) with encryption status and key holder per store
        tr: Depo başına şifreleme durumu ve anahtar sahibini gösteren depo envanteri (CON-STO-01 + sağlayıcı depoları ve yedekler)
      - type: CFG
        en: Encryption configuration for organisation-operated stores
        tr: Kurumun işlettiği depolar için şifreleme yapılandırması
      - type: DOC
        en: Provider documentation for provider-operated stores
        tr: Sağlayıcının işlettiği depolar için sağlayıcı belgeleri
    checks:   # A2 — puan schema.md 5.5 kuralıyla hesaplanır
      - id: c1
        kind: exist
        type: binary
        text:
          en: The stores holding the system's source documents or corpus are encrypted at rest.
          tr: Sistemin kaynak belgelerini ya da korpusunu tutan depolar depolamada şifreli.
        terms:
        - ai-data-store
        evidence: CFG
        qs: true
      - id: c2
        kind: core
        type: binary
        text:
          en: A store inventory lists every AI data store, including indexes, prompt and response logs, backups
            and provider-run stores.
          tr: Depo envanteri indeksler, prompt ve yanıt kayıtları, yedekler ve sağlayıcı depoları dahil her
            AI veri deposunu sayıyor.
        terms:
        - ai-data-store
        evidence: DOC
        qs: true
      - id: c3
        kind: core
        type: ratio
        threshold:
          min: 1.0
        text:
          en: Share of stores in the inventory that are encrypted at rest, shown by configuration or provider
            documentation.
          tr: Envanterdeki depolardan depolamada şifreli olduğu yapılandırma ya da sağlayıcı belgesiyle gösterilenlerin
            oranı.
        terms:
        - ai-data-store
        evidence: CFG
        qs: true
        sampling: true
      - id: c4
        kind: core
        type: ratio
        threshold:
          min: 1.0
        text:
          en: Share of stores in the inventory with a recorded key owner.
          tr: Envanterdeki depolardan anahtar sahibi kayıtlı olanların oranı.
        terms:
        - key-owner
        evidence: DOC
        qs: true
      - id: s1
        kind: sustain
        type: date
        threshold:
          max_months: review_interval
        text:
          en: Key rotation or access to keys was reviewed; the dated record is within review_interval.
          tr: Anahtar rotasyonu ya da anahtarlara erişim gözden geçirilmiş; tarihli kaydı review_interval içinde.
        terms:
        - dated-record
        evidence: DOC
        qs: true
    review_interval: 12
    quick_scan: true
    qs_question:
      en: Are the documents, indexes and logs used by your AI systems encrypted where they are stored?
      tr: AI sistemlerinizin kullandığı belgeler, indeksler ve kayıtlar saklandıkları yerde şifreli mi?
    mappings:
      - {framework: KVKK, ref: "md. 12(1)"}
      - {framework: GDPR, ref: "Art. 32(1)(a)"}
      - {framework: ISO/IEC 27001:2022, ref: "A.8.24"}
    services: [AS-01, AS-02]
    legacy: "L1 level text — encryption at rest (no v0 cell)"
    status: approved
    since: v1.0-draft
    notes: >
      v0'da hücresi olmayan L1 şartı. Anahtar sahibi bilgisi SOV iddiası için G-SUP-02'ye
      girdi. Kayıt ve yedeklerin açıkça sayılması bilinçli: tipik açık orada.

  - id: CON-INF-01
    block: matrix
    layer: CON
    stage: INF
    title:
      en: Inference inside the governed boundary
      tr: Çıkarımın yönetilen sınır içinde kalması
    objective:
      en: >
        Model execution runs inside the organisation's governed boundary, and the inference
        environment has no outbound network access except to explicitly listed internal
        destinations.
      tr: >
        Model çalıştırma kurumun yönetilen sınırı içinde gerçekleşir ve çıkarım ortamının açıkça
        listelenmiş iç hedefler dışında dışarıya ağ erişimi yoktur.
    question:
      en: Where do the models run, and can the inference environment reach anything outside the boundary?
      tr: Modeller nerede çalışıyor ve çıkarım ortamı sınırın dışındaki bir yere erişebiliyor mu?
    level: {CE: null, SOV: L1}
    applicability:
      en: Sovereign profile only. For Controlled External systems assess CON-INF-02.
      tr: Yalnız Sovereign profil. Controlled External sistemlerde CON-INF-02 değerlendirilir.
    evidence:
      - type: DOC
        en: Architecture showing where each model runs and the boundary
        tr: Her modelin nerede çalıştığını ve sınırı gösteren mimari
      - type: CFG
        en: Egress policy for the inference environment (default deny, listed internal destinations)
        tr: Çıkarım ortamı için çıkış politikası (varsayılan red, listelenmiş iç hedefler)
      - type: LOG
        en: Egress or drop logs from the inference environment for at least 7 days of operation, or a dated egress test
        tr: Çıkarım ortamından en az 7 günlük çalışmaya ait çıkış/düşürme kayıtları ya da tarihli çıkış testi
    checks:   # A2 — puan schema.md 5.5 kuralıyla hesaplanır
      - id: c1
        kind: exist
        type: binary
        text:
          en: At least one model of the system runs inside the managed boundary (not through an external service).
          tr: Sistemin en az bir modeli yönetilen sınır içinde çalışıyor (dış bir servis üzerinden değil).
        terms:
        - managed-boundary
        evidence: DOC
        qs: true
      - id: c2
        kind: core
        type: ratio
        threshold:
          min: 1.0
        text:
          en: Share of the system's models that run inside the managed boundary.
          tr: Sistemin modellerinden yönetilen sınır içinde çalışanların oranı.
        terms:
        - managed-boundary
        evidence: DOC
        qs: true
      - id: c3
        kind: core
        type: binary
        text:
          en: Egress from the inference environment is default-deny, with only listed internal destinations
            allowed.
          tr: Çıkarım ortamından çıkış varsayılan red; yalnız listelenmiş iç hedeflere izin var.
        terms:
        - default-deny-egress
        evidence: CFG
        qs: true
      - id: c4
        kind: core
        type: binary
        text:
          en: The allow list contains no external destination (including telemetry and runtime model or package
            downloads).
          tr: İzin listesinde hiçbir dış hedef yok (telemetri, çalışma anında model ya da paket indirme dahil).
        evidence: CFG
        qs: true
      - id: c5
        kind: core
        type: binary
        text:
          en: Egress or drop logs covering at least 7 days of operation, or a dated egress test, show no other
            external connection.
          tr: En az 7 günlük çalışmaya ait çıkış/düşürme kayıtları ya da tarihli bir çıkış testi başka bir dış
            bağlantı olmadığını gösteriyor.
        evidence: LOG
        qs: false
      - id: s1
        kind: sustain
        type: binary
        text:
          en: An outbound connection attempt from the inference environment raises an alert, and each alert
            has a handling record.
          tr: Çıkarım ortamından dışarıya bağlantı denemesi alarm üretiyor ve her alarmın ele alınma kaydı var.
        evidence: LOG
        qs: true
      - id: s2
        kind: sustain
        type: date
        threshold:
          max_months: review_interval
        text:
          en: Date of the latest egress test is within review_interval.
          tr: Son çıkış testinin tarihi review_interval içinde.
        evidence: TST
        qs: true
    review_interval: 6
    quick_scan: true
    qs_question:
      en: Do your AI models run on your own infrastructure, with no outbound internet access?
      tr: AI modelleriniz kendi altyapınızda, dışarıya internet erişimi olmadan mı çalışıyor?
    validation_tests:
      - id: VT-CON-INF-01-a
        precondition:
          en: Shell or job execution available inside the inference environment (test system).
          tr: Çıkarım ortamında kabuk ya da iş çalıştırma imkânı (test sistemi).
        steps:
          en: Attempt outbound connections to an external address and to an unlisted internal address.
          tr: Dış bir adrese ve listelenmemiş bir iç adrese bağlantı dene.
        expected:
          en: Both refused; attempt logged.
          tr: İkisi de reddediliyor; deneme kaydediliyor.
        supports_score: 2
    mappings:
      - {framework: KVKK, ref: "md. 9, md. 12(1)"}
      - {framework: ISO/IEC 27001:2022, ref: "A.8.20, A.8.22"}
      - {framework: BDDK, ref: "Bankaların Bilgi Sistemleri ve Elektronik Bankacılık Hizmetleri Hakkında Yönetmelik (RG 15.03.2020) md. 25 — birincil ve ikincil sistemler yurt içinde"}
    services: [AS-01, AS-02, AS-03]
    legacy: "Containment x Inference — Execution air-gap"
    status: approved
    since: v1.0-draft
    notes: >
      v0 "air-gap / activations cannot be exfiltrated" → gözlemlenebilir olan çıkış reddine
      indirgendi. Y-6: v0 L1 tanımı ("dış API yok") artık yalnız SOV profilinin kapısı.

  - id: CON-INF-02
    block: matrix
    layer: CON
    stage: INF
    title:
      en: External inference only through sanctioned endpoints
      tr: Dış çıkarımın yalnız onaylı uç noktalardan yapılması
    objective:
      en: >
        Calls to external model providers pass through a controlled point that allows only
        sanctioned providers, endpoints and accounts (organisation-contracted, not personal),
        and the calls are logged.
      tr: >
        Dış model sağlayıcılarına yapılan çağrılar yalnız onaylı sağlayıcılara, uç noktalara ve
        hesaplara (kişisel değil, kurumun sözleşmeli hesapları) izin veren kontrollü bir
        noktadan geçer ve kayıt altına alınır.
    question:
      en: Through which point do your systems call external AI models, and can they reach a provider or account that is not sanctioned?
      tr: Sistemleriniz dış AI modellerini hangi noktadan çağırıyor; onaylı olmayan bir sağlayıcıya ya da hesaba erişebilirler mi?
    level: {CE: L1, SOV: null}
    applicability:
      en: Controlled External profile only. For Sovereign systems assess CON-INF-01.
      tr: Yalnız Controlled External profil. Sovereign sistemlerde CON-INF-01 değerlendirilir.
    evidence:
      - type: DOC
        en: List of sanctioned providers, endpoints and organisation accounts (consistent with G-SUP-01)
        tr: Onaylı sağlayıcılar, uç noktalar ve kurum hesapları listesi (G-SUP-01 ile tutarlı)
      - type: CFG
        en: Controlled point configuration (gateway, proxy or egress rules) allowing only listed destinations
        tr: Yalnız listelenmiş hedeflere izin veren kontrollü nokta yapılandırması (gateway, proxy ya da çıkış kuralları)
      - type: LOG
        en: Call logs with provider, endpoint, calling system and time for the last 30 days
        tr: Son 30 güne ait sağlayıcı, uç nokta, çağıran sistem ve zaman içeren çağrı kayıtları
    checks:   # A2 — puan schema.md 5.5 kuralıyla hesaplanır
      - id: c1
        kind: exist
        type: binary
        text:
          en: A controlled point exists for calls to external model providers.
          tr: Dış model sağlayıcılarına yapılan çağrılar için kontrollü bir nokta var.
        terms:
        - controlled-point
        evidence: CFG
        qs: true
      - id: c2
        kind: core
        type: ratio
        threshold:
          min: 1.0
        text:
          en: Share of Controlled External systems that call external models only through the controlled point.
          tr: Controlled External sistemlerden dış modelleri yalnız kontrollü nokta üzerinden çağıranların oranı.
        terms:
        - controlled-point
        evidence: CFG
        qs: true
        sampling: true
      - id: c3
        kind: core
        type: binary
        text:
          en: The controlled point allows only the destinations and organisation accounts on the approved list
            (consistent with G-SUP-01).
          tr: Kontrollü nokta yalnız onaylı listedeki hedeflere ve kurum hesaplarına izin veriyor (G-SUP-01
            ile tutarlı).
        terms:
        - org-account
        evidence: CFG
        qs: true
      - id: c4
        kind: core
        type: binary
        text:
          en: Direct egress to provider endpoints that bypasses the controlled point is blocked.
          tr: Kontrollü noktayı atlayarak sağlayıcı uç noktalarına doğrudan çıkış engelli.
        terms:
        - controlled-point
        evidence: CFG
        qs: true
      - id: c5
        kind: core
        type: binary
        text:
          en: No personal account or personal API key is used to call external models.
          tr: Dış modelleri çağırmak için kişisel hesap ya da kişisel API anahtarı kullanılmıyor.
        terms:
        - org-account
        evidence: CFG
        qs: true
      - id: c6
        kind: core
        type: binary
        text:
          en: Calls of the last 30 days are logged with provider, endpoint, calling system and time.
          tr: Son 30 günün çağrıları sağlayıcı, uç nokta, çağıran sistem ve zamanla kayıtlı.
        evidence: LOG
        qs: true
      - id: s1
        kind: sustain
        type: date
        threshold:
          max_months: review_interval
        text:
          en: Call logs were reviewed against G-SUP-01; the dated record is within review_interval.
          tr: Çağrı kayıtları G-SUP-01 ile karşılaştırılarak gözden geçirilmiş; tarihli kaydı review_interval
            içinde.
        terms:
        - dated-record
        evidence: DOC
        qs: true
      - id: s2
        kind: sustain
        type: binary
        text:
          en: Every provider removed from the approved list was blocked at the controlled point within 5 business days, shown by records. If no provider was removed in the period, a written blocking procedure with the 5 business day target is enough.
          tr: Onaylı listeden çıkarılan her sağlayıcının kontrollü noktada 5 iş günü içinde engellendiği kayıtla gösteriliyor. Dönem içinde hiç sağlayıcı çıkarılmadıysa 5 iş günü hedefini içeren yazılı engelleme prosedürü yeterli.
        evidence: LOG
        qs: true
    review_interval: 3
    quick_scan: true
    qs_question:
      en: Do your systems call external AI services only through a central, controlled point using organisation accounts?
      tr: Sistemleriniz dış AI servislerini yalnız merkezi, kontrollü bir noktadan ve kurum hesaplarıyla mı çağırıyor?
    validation_tests:
      - id: VT-CON-INF-02-a
        precondition:
          en: Test host in the same network zone as an AI-consuming system.
          tr: AI kullanan bir sistemle aynı ağ bölgesinde test sunucusu.
        steps:
          en: Attempt a direct call to a sanctioned provider bypassing the controlled point, and a call to an unsanctioned provider through it.
          tr: Onaylı bir sağlayıcıya kontrollü noktayı atlayarak doğrudan, onaysız bir sağlayıcıya ise kontrollü noktadan çağrı yapmayı dene.
        expected:
          en: Both refused; attempts logged.
          tr: İkisi de reddediliyor; denemeler kaydediliyor.
        supports_score: 2
    mappings:
      - {framework: KVKK, ref: "md. 9, md. 12(1)"}
      - {framework: ISO/IEC 27001:2022, ref: "A.5.23, A.8.20"}
      - {framework: ISO/IEC 42001, ref: "Annex A.10.3 (suppliers)"}
    services: [AS-01, AS-02, AS-03, AS-04]
    legacy: "Containment x Inference — Controlled External counterpart (new, Y-6)"
    status: approved
    since: v1.0-draft
    notes: >
      Y-6'nın CE tarafı: SOV'un "dış çağrı yok" kapısının CE karşılığı "dış çağrı yalnız
      kontrollü noktadan". Kontrollü nokta tipik olarak AI gateway (Y-9 ile ilişkili); madde
      teknolojiden bağımsız yazıldı.
