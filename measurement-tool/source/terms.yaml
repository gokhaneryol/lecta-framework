# Lecta Sovereign AI Control Framework — terimler sözlüğü
# Kontrol metinlerinde geçen ve iki değerlendiricinin aynı şeyi anlaması gereken terimler.
# Kontrol `terms: [id]` ile atıf yapar; rehber ve inceleme tablosu tanımı maddenin altına basar.
# Kural: tanım, bir şeyin bu terime girip girmediğine evet/hayır ile karar verdirmeli.

terms:
  - id: data-class
    term: {en: data class, tr: veri sınıfı}
    definition:
      en: >
        A category in the organisation's written data classification (e.g. public,
        internal, confidential, personal, special-category personal). The classification
        must be a dated document; an unwritten or verbal scheme does not count.
      tr: >
        Kurumun yazılı veri sınıflandırmasındaki bir kategori (ör. açık, iç, gizli, kişisel,
        özel nitelikli kişisel). Sınıflandırma tarihli bir belge olmalıdır; yazılı olmayan ya
        da sözlü bir ayrım sayılmaz.

  - id: sanctioned-tool-list
    term: {en: sanctioned tool list, tr: onaylı araç listesi}
    definition:
      en: >
        A written list naming each AI tool staff may use (product and, where relevant,
        account type such as enterprise/consumer), with an owner and a last-update date.
        A list that names categories only ("approved chatbots") does not count.
      tr: >
        Çalışanların kullanabileceği her yapay zekâ aracını adıyla (ürün ve gerekiyorsa hesap
        türü, ör. kurumsal/bireysel) sayan, sahibi ve son güncelleme tarihi olan yazılı liste.
        Yalnız kategori sayan liste ("onaylı sohbet botları") sayılmaz.

  - id: ingestion-path
    term: {en: ingestion path, tr: veri giriş yolu}
    definition:
      en: >
        Any route by which content enters an AI system so that it can be stored, indexed,
        used as context or used for training: file upload, connector to another system,
        API, scheduled import, e-mail or chat channel. Each connector or API counts as a
        separate path.
      tr: >
        İçeriğin bir yapay zekâ sistemine saklanmak, indekslenmek, bağlam olarak ya da eğitimde
        kullanılmak üzere girdiği her yol: dosya yükleme, başka sisteme bağlayıcı, API, zamanlanmış
        aktarım, e-posta ya da sohbet kanalı. Her bağlayıcı ve her API ayrı yol sayılır.

  - id: path-inventory
    term: {en: ingestion path inventory, tr: giriş yolu envanteri}
    definition:
      en: >
        A written list (or architecture/data-flow diagram) that names every ingestion path
        of the system, with a date. It is the denominator for ratio checks on paths.
      tr: >
        Sistemin her veri giriş yolunu adıyla gösteren, tarihli yazılı liste (ya da mimari/veri
        akış şeması). Yollarla ilgili oran kontrollerinin paydasıdır.

  - id: treatment
    term: {en: treatment, tr: muamele}
    definition:
      en: >
        The action defined in HYG-ING-01 for each personal data category: mask, tokenise,
        pseudonymise, drop or block. Detecting and logging only is not treatment.
      tr: >
        HYG-ING-01'de her kişisel veri kategorisi için tanımlanan işlem: maskeleme,
        tokenizasyon, takma adlandırma, çıkarma ya da engelleme. Yalnız tespit edip kaydetmek
        muamele değildir.

  - id: before-persistence
    term: {en: before persistence, tr: saklamadan önce}
    definition:
      en: >
        The control runs before the content is written to any store the AI system reads
        from (vector index, database, file store, training set). Temporary processing
        memory does not count as a store.
      tr: >
        Kontrol, içerik yapay zekâ sisteminin okuduğu herhangi bir depoya (vektör indeksi,
        veritabanı, dosya deposu, eğitim kümesi) yazılmadan önce çalışır. Geçici işlem belleği
        depo sayılmaz.

  - id: dated-record
    term: {en: dated record, tr: tarihli kayıt}
    definition:
      en: >
        A document, ticket or log entry showing the date, who did the work, what was found
        and the resulting action (or "no finding"). A calendar invite or a verbal statement
        does not count.
      tr: >
        Tarihi, işi kimin yaptığını, ne bulunduğunu ve sonuçtaki aksiyonu (ya da "bulgu yok")
        gösteren belge, kayıt talebi ya da log girdisi. Takvim daveti ya da sözlü beyan sayılmaz.

  - id: approved-source-register
    term:
      en: approved source register
      tr: onaylı kaynak kaydı
    definition:
      en: 'A written register listing, for each source allowed to feed the AI system: the source, its owner,
        its data categories, the ingestion path it uses and the approval date.'
      tr: AI sistemini beslemesine izin verilen her kaynak için kaynağı, sahibini, veri kategorilerini,
        kullandığı giriş yolunu ve onay tarihini sayan yazılı kayıt.

  - id: ai-data-store
    term:
      en: AI data store
      tr: AI veri deposu
    definition:
      en: 'Any store holding data of the AI system: document corpus, vector index, database, model files,
        prompt and response logs, backups. Stores run by the provider count.'
      tr: 'AI sisteminin verisini tutan her depo: belge korpusu, vektör indeksi, veritabanı, model dosyaları,
        prompt ve yanıt kayıtları, yedekler. Sağlayıcının işlettiği depolar dahildir.'

  - id: key-owner
    term:
      en: key owner
      tr: anahtar sahibi
    definition:
      en: 'The party that controls the encryption key of a store, recorded as one of: the organisation (own
        KMS/HSM), the organisation through a provider KMS, or the provider.'
      tr: 'Bir deponun şifreleme anahtarını kontrol eden taraf; şunlardan biri olarak kaydedilir: kurum
        (kendi KMS/HSM), sağlayıcı KMS''i üzerinden kurum ya da sağlayıcı.'

  - id: managed-boundary
    term:
      en: managed boundary
      tr: yönetilen sınır
    definition:
      en: The infrastructure the organisation operates or contractually controls (own data centre, dedicated
        or private cloud tenancy) where it sets network policy. A shared public API is outside the boundary.
      tr: Kurumun işlettiği ya da sözleşmeyle kontrol ettiği, ağ politikasını kendisinin belirlediği altyapı
        (kendi veri merkezi, ayrılmış ya da özel bulut kiracılığı). Paylaşımlı genel API sınırın dışındadır.

  - id: default-deny-egress
    term:
      en: default-deny egress
      tr: varsayılan red çıkış
    definition:
      en: Outbound traffic is blocked unless the destination is on an explicit allow list; the rule is enforced
        in network configuration, not by the application.
      tr: Hedef açık bir izin listesinde değilse dışarıya giden trafik engellenir; kural uygulamada değil
        ağ yapılandırmasında uygulanır.

  - id: controlled-point
    term:
      en: controlled point
      tr: kontrollü nokta
    definition:
      en: 'A single enforcement point that all calls to external model providers pass through and that can
        allow, block and log them: an AI gateway, a forward proxy or egress firewall rules.'
      tr: 'Dış model sağlayıcılarına yapılan tüm çağrıların geçtiği, bunlara izin verebilen, engelleyebilen
        ve kaydedebilen tek uygulama noktası: AI gateway, ileri proxy ya da çıkış firewall kuralları.'

  - id: org-account
    term:
      en: organisation account
      tr: kurum hesabı
    definition:
      en: A provider account contracted by the organisation, whose keys are issued and revoked by the organisation.
        An account opened by an employee in their own name does not count, even if paid by the organisation.
      tr: Kurumun sözleşme yaptığı, anahtarlarını kurumun verip geri aldığı sağlayıcı hesabı. Bir çalışanın
        kendi adına açtığı hesap, ücretini kurum ödese bile sayılmaz.

  - id: approval-record
    term:
      en: approval record
      tr: onay kaydı
    definition:
      en: A record showing who approved, the date and the version approved (board minute, signed cover page
        or document management workflow entry).
      tr: Onaylayanı, tarihi ve onaylanan sürümü gösteren kayıt (kurul kararı, imzalı kapak sayfası ya da
        belge yönetim sistemi iş akışı girdisi).

  - id: announcement-record
    term:
      en: announcement record
      tr: duyuru kaydı
    definition:
      en: 'A dated record showing the document reached in-scope staff: intranet publication, e-mail to a
        distribution list covering them, or a read-receipt list.'
      tr: 'Belgenin kapsamdaki çalışanlara ulaştığını gösteren tarihli kayıt: intranet yayını, onları kapsayan
        dağıtım listesine e-posta ya da okundu listesi.'

  - id: inventory-fields
    term:
      en: mandatory inventory fields
      tr: envanter zorunlu alanları
    definition:
      en: Purpose, owner, user groups, data categories, provider, profile (CE/SOV) and status.
      tr: Amaç, sahip, kullanıcı grupları, veri kategorileri, sağlayıcı, profil (CE/SOV) ve durum.

  - id: ai-service-domain-list
    term:
      en: AI service domain list
      tr: AI servis alan adı listesi
    definition:
      en: A dated list of the domains and endpoints used to recognise AI service traffic in logs. A vendor
        category feed counts if its update date can be shown.
      tr: Kayıtlarda AI servis trafiğini tanımak için kullanılan alan adı ve uç nokta listesi, tarihli.
        Üretici kategori beslemesi, güncelleme tarihi gösterilebiliyorsa sayılır.

  - id: named-owner
    term:
      en: named owner
      tr: adı belli sahip
    definition:
      en: A specific person, or a role held by exactly one person at a time, recorded by name or role title.
        A unit name or "IT" does not count.
      tr: Belirli bir kişi ya da aynı anda tek kişinin tuttuğu bir rol; adıyla ya da rol unvanıyla kayıtlı.
        Birim adı ya da "BT" sayılmaz.

  - id: consultation-points
    term:
      en: consultation points
      tr: danışma noktaları
    definition:
      en: 'Written events at which the DPO and security must be consulted; at least: a new AI system, a
        new personal data category, a new provider.'
      tr: 'DPO ve güvenliğe danışılması gereken, yazılı olaylar; en az: yeni AI sistemi, yeni kişisel veri
        kategorisi, yeni sağlayıcı.'

  - id: ai-risk-groups
    term:
      en: AI-specific risk groups
      tr: AI'ye özgü risk grupları
    definition:
      en: 'Four groups: data leakage through prompts or outputs; wrong or harmful output; unauthorised access
        through the model; provider dependence.'
      tr: 'Dört grup: prompt ya da çıktı yoluyla veri sızıntısı; yanlış ya da zararlı çıktı; model üzerinden
        yetkisiz erişim; sağlayıcı bağımlılığı.'

  - id: reassessment-triggers
    term:
      en: reassessment triggers
      tr: yeniden değerlendirme tetikleyicileri
    definition:
      en: 'Written events that require a new assessment; at least: a new model or provider, a new data category,
        a new user group, an incident.'
      tr: 'Yeni değerlendirme gerektiren yazılı olaylar; en az: yeni model ya da sağlayıcı, yeni veri kategorisi,
        yeni kullanıcı grubu, olay.'

  - id: supplier-topics
    term:
      en: five supplier topics
      tr: beş sağlayıcı konusu
    definition:
      en: Where data is held; retention period; use of customer data for training; sub-processors; cross-border
        transfer mechanism.
      tr: Verinin tutulduğu yer; saklama süresi; müşteri verisinin eğitimde kullanımı; alt işleyenler; yurt
        dışı aktarım mekanizması.

  - id: ai-user
    term:
      en: AI user
      tr: AI kullanıcısı
    definition:
      en: A person with access to at least one system in the AI inventory (G-INV-01). The count of AI users
        is the denominator for training ratios.
      tr: AI envanterindeki (G-INV-01) en az bir sisteme erişimi olan kişi. Eğitim oranlarının paydası AI
        kullanıcısı sayısıdır.

  - id: literacy-topics
    term:
      en: three literacy topics
      tr: üç okuryazarlık konusu
    definition:
      en: Acceptable use (G-POL-02); data risks (what may not be entered and why); limits of AI output (errors,
        verification duty).
      tr: Kabul edilebilir kullanım (G-POL-02); veri riskleri (neyin girilemeyeceği ve nedeni); AI çıktısının
        sınırları (hatalar, doğrulama yükümlülüğü).

  - id: ai-incident-types
    term:
      en: four AI incident types
      tr: dört AI olay türü
    definition:
      en: Data leakage through prompts or outputs; harmful or wrong output with impact; unauthorised access
        through the model; provider-side incident.
      tr: Prompt ya da çıktı yoluyla veri sızıntısı; etkisi olan zararlı ya da yanlış çıktı; model üzerinden
        yetkisiz erişim; sağlayıcı tarafı olay.

  - id: notification-deadlines
    term:
      en: applicable notification deadlines
      tr: uygulanan bildirim süreleri
    definition:
      en: Deadlines that apply to the organisation, each with its legal basis and recipient; at least KVKK
        breach notification (72 hours) and, where applicable, Law 7545 and sector rules.
      tr: Kuruma uygulanan süreler, her biri hukuki dayanağı ve muhatabıyla; en az KVKK ihlal bildirimi
        (72 saat) ve uygulanıyorsa 7545 sayılı Kanun ve sektör kuralları.

  - id: prompt-channel
    term:
      en: prompt channel
      tr: prompt kanalı
    definition:
      en: 'Any route by which text or files reach the model as a prompt: chat interface, API, plug-in or
        integration, e-mail or chat bot. Each counts separately.'
      tr: 'Metnin ya da dosyanın modele prompt olarak ulaştığı her yol: sohbet arayüzü, API, eklenti ya
        da entegrasyon, e-posta ya da sohbet botu. Her biri ayrı sayılır.'

  - id: bypass
    term:
      en: bypass
      tr: atlatma
    definition:
      en: A user action that sends content to the model without the defined treatment (e.g. "send anyway",
        disabling the control for a session).
      tr: İçeriği tanımlı muamele olmadan modele gönderen kullanıcı eylemi (ör. "yine de gönder", kontrolü
        bir oturum için kapatma).

  - id: shared-account
    term:
      en: shared or generic account
      tr: paylaşımlı ya da genel hesap
    definition:
      en: An account used by more than one person, or not tied to a named person (e.g. "admin", "ai-team").
        Service accounts used only by a system and with a named owner do not count.
      tr: Birden fazla kişinin kullandığı ya da adı belli bir kişiye bağlı olmayan hesap (ör. "admin", "ai-ekip").
        Yalnız bir sistemin kullandığı ve adı belli sahibi olan servis hesapları sayılmaz.

  - id: provenance-fields
    term:
      en: four provenance fields
      tr: dört kaynak alanı
    definition:
      en: Source, time, data categories detected, treatment applied.
      tr: Kaynak, zaman, tespit edilen veri kategorileri, uygulanan muamele.

  - id: protected-log-store
    term:
      en: protected log store
      tr: korumalı kayıt deposu
    definition:
      en: 'A log store where at least one holds: append-only or write-once (WORM) setting; write/delete
        permission separate from the system administrators; integrity verification (hash chain or signature).'
      tr: 'Şunlardan en az birinin geçerli olduğu kayıt deposu: yalnız ekleme ya da tek yazım (WORM) ayarı;
        sistem yöneticilerinden ayrı yazma/silme yetkisi; bütünlük doğrulaması (özet zinciri ya da imza).'

  - id: special-category
    term:
      en: special-category personal data
      tr: özel nitelikli kişisel veri
    definition:
      en: 'The categories in KVKK art. 6 (and GDPR art. 9 where applicable): race, ethnic origin, political
        opinion, belief, appearance, association/union membership, health, sexual life, criminal conviction,
        biometric and genetic data.'
      tr: 'KVKK md. 6''daki (ve uygulanıyorsa GDPR md. 9''daki) kategoriler: ırk, etnik köken, siyasi düşünce,
        inanç, kılık kıyafet, dernek/sendika üyeliği, sağlık, cinsel hayat, ceza mahkûmiyeti, biyometrik
        ve genetik veri.'

  - id: outdated-protocol
    term:
      en: outdated protocol version
      tr: eskimiş protokol sürümü
    definition:
      en: TLS below 1.2, any SSL version, SSH version 1, or an unencrypted protocol (HTTP, FTP, LDAP, SMTP
        without STARTTLS) on a flow carrying AI data.
      tr: 1.2 altındaki TLS, herhangi bir SSL sürümü, SSH sürüm 1 ya da AI verisi taşıyan bir akışta şifresiz
        protokol (HTTP, FTP, LDAP, STARTTLS'siz SMTP).

  - id: network-segmented
    term:
      en: network-segmented
      tr: ağ düzeyinde ayrıştırılmış
    definition:
      en: The store sits in a network segment (VLAN, subnet, security group or namespace policy) that the
        general user or server network cannot reach directly.
      tr: Depo, genel kullanıcı ya da sunucu ağının doğrudan ulaşamadığı bir ağ bölümünde (VLAN, alt ağ,
        güvenlik grubu ya da namespace politikası) bulunur.

  - id: default-deny-access
    term:
      en: default-deny access
      tr: varsayılan red erişim
    definition:
      en: Inbound connections to the store are blocked unless the source is on an explicit allow list in
        network configuration.
      tr: Kaynak ağ yapılandırmasındaki açık izin listesinde değilse depoya gelen bağlantılar engellenir.

  - id: classification-record
    term:
      en: classification record
      tr: sınıflandırma kaydı
    definition:
      en: 'Per system: the risk category assigned, the rationale, the signer by name and the date.'
      tr: 'Sistem başına: atanan risk kategorisi, gerekçe, adıyla imzalayan ve tarih.'

  - id: pipeline-stages
    term:
      en: six pipeline stages
      tr: altı pipeline aşaması
    definition:
      en: Ingestion, storage, prompt, inference, response, downstream (meta.yaml stages).
      tr: Veri girişi, saklama, prompt, çıkarım, yanıt, aşağı akış (meta.yaml aşamaları).

  - id: sovereignty-questions
    term:
      en: three sovereignty questions
      tr: üç egemenlik sorusu
    definition:
      en: Jurisdiction of the provider's ultimate parent company; evidence of the architectural boundary
        where data is processed; ability to operate independently of, or exit from, the provider.
      tr: Sağlayıcının nihai ana şirketinin hukuki yetki alanı; verinin işlendiği mimari sınırın kanıtı;
        sağlayıcıdan bağımsız işletebilme ya da hizmetten çıkabilme.

  - id: critical-provider
    term:
      en: critical provider
      tr: kritik sağlayıcı
    definition:
      en: A provider whose unavailability would stop a live AI system with no alternative in place, or that
        is marked critical in the risk assessment (G-RSK-01).
      tr: Erişilemez olması durumunda canlı bir AI sistemini alternatifsiz durduracak ya da risk değerlendirmesinde
        (G-RSK-01) kritik işaretlenmiş sağlayıcı.

  - id: contract-clauses
    term:
      en: five contract clauses
      tr: beş sözleşme maddesi
    definition:
      en: Data processing terms; ban on, or opt-out from, use of customer data for training; deletion at
        termination; breach notification within a stated period; audit or assurance rights.
      tr: Veri işleme şartları; müşteri verisinin eğitimde kullanılmasının yasağı ya da bundan çıkış; sona
        ermede silme; belirtilmiş süre içinde ihlal bildirimi; denetim ya da güvence hakları.

  - id: risk-acceptance
    term:
      en: risk acceptance
      tr: risk kabulü
    definition:
      en: A record signed by the system owner accepting a named gap, referenced in the risk assessment (G-RSK-01),
        with a date.
      tr: Sistem sahibinin imzaladığı, adı konmuş bir eksikliği kabul eden, risk değerlendirmesinde (G-RSK-01)
        atıf yapılan, tarihli kayıt.

  - id: ai-roles
    term:
      en: AI roles
      tr: AI rolleri
    definition:
      en: Roles that develop, operate, review or oversee AI systems, taken from G-ROL-01 and G-OVS-01.
      tr: AI sistemlerini geliştiren, işleten, gözden geçiren ya da gözetim yapan roller; G-ROL-01 ve G-OVS-01'den
        alınır.

  - id: oversight-elements
    term:
      en: four oversight elements
      tr: dört gözetim unsuru
    definition:
      en: Output classes that need human review; the reviewing role; the time limit for the decision; what
        happens to the output while review is pending.
      tr: İnsan incelemesi gerektiren çıktı sınıfları; inceleyen rol; karar için süre sınırı; inceleme beklerken
        çıktıya ne olacağı.

  - id: fail-closed
    term:
      en: fail-closed
      tr: fail-closed
    definition:
      en: 'When the control cannot do its job, data does not pass: it is blocked or quarantined.'
      tr: 'Kontrol işini yapamadığında veri geçmez: engellenir ya da karantinaya alınır.'

  - id: failure-classes
    term:
      en: three failure classes
      tr: üç hata sınıfı
    definition:
      en: Control unreachable; control returns an error or times out; unsupported language, format or category.
      tr: Kontrole erişilemiyor; kontrol hata döndürüyor ya da zaman aşımına uğruyor; desteklenmeyen dil,
        format ya da kategori.

  - id: known-answer-set
    term:
      en: known-answer test set
      tr: bilinen-cevaplı test seti
    definition:
      en: A synthetic data set in which every occurrence of each category is labelled in advance, so recall
        can be computed per category. No real personal data.
      tr: Her kategorinin her geçişinin önceden etiketlendiği, böylece kategori başına recall hesaplanabilen
        sentetik veri seti. Gerçek kişisel veri içermez.

  - id: own-credential
    term:
      en: own credential
      tr: kendine ait kimlik bilgisi
    definition:
      en: A credential used by exactly one source (system, connector or person). A key shared by two connectors,
        or a team upload account, does not count.
      tr: Yalnız bir kaynağın (sistem, bağlayıcı ya da kişi) kullandığı kimlik bilgisi. İki bağlayıcının
        paylaştığı anahtar ya da ekip yükleme hesabı sayılmaz.
