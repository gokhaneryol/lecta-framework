# Lecta Sovereign AI Control Framework — Traceability layer
# framework v1.0-draft · schema: ../schema.md · text fields bilingual {en, tr}
# Session 3 (14 Oct 2026): L1 key item for the Quick Scan cut (draft). Other TRA cells: pending.

items:

  - id: TRA-ING-01
    block: matrix
    layer: TRA
    stage: ING
    title:
      en: Tamper-evident provenance log
      tr: Kurcalamaya dayanıklı kaynak kaydı
    objective:
      en: >
        Every data item entering the AI system is logged with source, time, data categories
        and treatment applied, in a log that ordinary system administrators cannot alter or
        delete without detection.
      tr: >
        AI sistemine giren her veri öğesi kaynak, zaman, veri kategorileri ve uygulanan
        muameleyle, olağan sistem yöneticilerinin fark edilmeden değiştiremeyeceği ya da
        silemeyeceği bir kayda yazılır.
    question:
      en: For a given document in the AI system, can you show where it came from, when, and what was done to it — and who could change that record?
      tr: AI sistemindeki herhangi bir belge için nereden, ne zaman geldiğini ve ona ne yapıldığını gösterebilir misiniz; bu kaydı kim değiştirebilir?
    level: {CE: L1, SOV: L1}
    applicability:
      en: Same as HYG-ING-01.
      tr: HYG-ING-01 ile aynı.
    evidence:
      - type: CFG
        en: Logging configuration on each ingestion path with the four fields (source, time, categories, treatment)
        tr: Her giriş yolunda dört alanı (kaynak, zaman, kategoriler, muamele) içeren kayıt yapılandırması
      - type: CFG
        en: Log store protection (append-only or write-once setting, separate permissions from system administrators, or integrity verification)
        tr: Kayıt deposu koruması (yalnız ekleme ya da tek yazım ayarı, sistem yöneticilerinden ayrı yetki ya da bütünlük doğrulaması)
      - type: TST
        en: Trace of three sampled stored items back to their log entries
        tr: Saklanan üç örnek öğenin kayıt girdilerine kadar izlenmesi
    checks:   # A2 — puan schema.md 5.5 kuralıyla hesaplanır
      - id: c1
        kind: exist
        type: binary
        text:
          en: Data ingestion is logged on at least one ingestion path.
          tr: En az bir giriş yolunda veri girişi kaydediliyor.
        evidence: CFG
        qs: true
      - id: c2
        kind: core
        type: ratio
        threshold:
          min: 1.0
        text:
          en: Share of ingestion paths that log all four provenance fields.
          tr: Giriş yollarından dört kaynak alanının hepsini kaydedenlerin oranı.
        terms:
        - provenance-fields
        - path-inventory
        evidence: CFG
        qs: true
        sampling: true
      - id: c3
        kind: core
        type: binary
        text:
          en: The log store is protected.
          tr: Kayıt deposu korumalı.
        terms:
        - protected-log-store
        evidence: CFG
        qs: true
      - id: c4
        kind: core
        type: ratio
        threshold:
          min: 1.0
          sample: 3
        text:
          en: Three sampled stored items are traced back to their log entries.
          tr: Saklanan üç örnek öğe kayıt girdilerine kadar izleniyor.
        evidence: TST
        qs: false
      - id: s1
        kind: sustain
        type: date
        threshold:
          max_months: review_interval
        text:
          en: Log integrity was verified (e.g. hash check or gap detection); the dated record is within review_interval.
          tr: Kayıt bütünlüğü doğrulanmış (ör. özet kontrolü ya da boşluk tespiti); tarihli kaydı review_interval
            içinde.
        terms:
        - dated-record
        evidence: DOC
        qs: true
      - id: s2
        kind: sustain
        type: binary
        text:
          en: The log retention period matches the defined retention period.
          tr: Kayıt saklama süresi tanımlı saklama süresiyle örtüşüyor.
        evidence: CFG
        qs: true
    review_interval: 3
    quick_scan: true
    qs_question:
      en: Can you show where each document in your AI systems came from and when, from a log that cannot be edited?
      tr: AI sistemlerinizdeki her belgenin nereden ve ne zaman geldiğini, değiştirilemeyen bir kayıttan gösterebilir misiniz?
    mappings:
      - {framework: ISO/IEC 27001:2022, ref: "A.8.15"}
      - {framework: ISO/IEC 42001, ref: "Annex A.7.5"}
      - {framework: ISO/IEC 42001, ref: "Annex A.6.2.8 (recording of event logs)"}
      - {framework: KVKK, ref: "md. 12(1)"}
    services: [AS-01, AS-02, AU-01]
    legacy: "Traceability x Ingestion — Provenance logging"
    status: approved
    since: v1.0-draft
    notes: >
      v0 "immutable and tamper-evident" ölçütsüzdü; üç mekanizmadan biri şartı ölçülebilir
      kıldı. Tek başına "log tutuluyor" 1 puan.
