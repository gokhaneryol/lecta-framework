<div id="na"{% if oob %} hx-swap-oob="true"{% endif %}>
  {% if blok.kontroller.c1 and blok.kontroller.c1.cevap == 'NA' %}
  {# Tarayıcıda required YOK: htmx form doğrulaması başarısız olursa sonraki kayıtları sessizce engeller.
     Zorunluluk sunucuda: gerekçesiz NA maddesi "eksik" kalır. #}
  <label class="na-gerekce">Uygulanmama gerekçesi (zorunlu; uygulanabilirlik ölçütüne dayanın)
    <textarea name="na_reason" rows="2" maxlength="500">{{ blok.na_reason or '' }}</textarea>
    {% if not (blok.na_reason or '').strip() %}<small class="hata">Gerekçe yazılmadan madde tamamlanmış sayılmaz.</small>{% endif %}
  </label>
  {% endif %}
</div>
