# /etc/apache2/sites-available/lecta-frui.deepwake.tech.conf
# Erişim: VPN (10.11.12.0/24) VE htpasswd. Kimlik uygulamaya X-Remote-User ile geçer.
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName lecta-frui.deepwake.tech

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8090/
    ProxyPassReverse / http://127.0.0.1:8090/

    RequestHeader set X-Forwarded-Proto "https"
    # İstemcinin gönderdiği başlık her durumda ezilir; değer Apache'nin doğruladığı kullanıcıdır
    RequestHeader set X-Remote-User "expr=%{REMOTE_USER}"
    Header always set Strict-Transport-Security "max-age=31536000"

    <Location />
        AuthType Basic
        AuthName "Lecta"
        AuthBasicProvider file
        AuthUserFile /etc/apache2/lecta-ui.htpasswd
        <RequireAll>
            Require ip 10.11.12.0/24
            Require valid-user
        </RequireAll>
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/lecta-frui-error.log
    CustomLog ${APACHE_LOG_DIR}/lecta-frui-access.log combined

SSLCertificateFile /etc/letsencrypt/live/lecta-frui.deepwake.tech/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/lecta-frui.deepwake.tech/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
<VirtualHost *:80>
    ServerName lecta-frui.deepwake.tech
    RewriteEngine on
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
